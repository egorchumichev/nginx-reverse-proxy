name: server

services:
  application:
    build:
      context: ./../
      dockerfile: dockerfile
    ports:
      - 80:80
      - 443:443
    volumes:
      - server-logs:/var/logs/nginx/
    networks:
      - server-network

networks:
  server-network:
    name: server-network

volumes:
  server-logs:
    name: server-logs
