name: nginx-reverse-proxy

services:
  application:
    build:
      context: ./../
      dockerfile: ./docker/dockerfile
    ports:
      - 80:80
      - 443:443
    volumes:
      - reverse-proxy-logs:/var/logs/nginx/
      - reverse-proxy-certificates:/etc/letsencrypt/
    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    name: reverse-proxy

volumes:
  reverse-proxy-logs:
    name: nginx-reverse-proxy-logs
  reverse-proxy-certificates:
    name: nginx-reverse-proxy-certificates
